[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dominio-linux"
version = "0.1.0"
description = "Criação e administração de domínio Samba em Linux pelo navegador"
readme = "README.md"
authors = [{name = "JLW Security"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1.5,<4",
  "ldap3>=2.9.1,<3",
]

[project.urls]
Repository = "https://github.com/ugoneiva/dominio-linux"
Issues = "https://github.com/ugoneiva/dominio-linux/issues"

[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "resources/*.py", "resources/LICENSE"]
